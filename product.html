<!DOCTYPE html>
<html lang="en">
<head>

    <title>Product Details</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body>

<script src="js/app.js"></script>
